<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <!-- Background Color -->
  <rect width="850" height="320" rx="16" fill="#0b0f17" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radial Glow Gradient -->
  <defs>
    <radialGradient id="orangeGlow" cx="95%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ff7a45" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Apply Radial Glow -->
  <rect width="850" height="320" rx="16" fill="url(#orangeGlow)"/>

  <!-- Decorative Wave Lines (Mathematical Curves) -->
  <g stroke="#ff7a45" fill="none" stroke-linecap="round">
    <path d="M 0,290 C 150,265 300,315 450,280 C 600,245 750,295 850,270" stroke-opacity="0.08" stroke-width="1.5"/>
    <path d="M 0,300 C 200,280 350,325 500,290 C 650,255 700,305 850,285" stroke-opacity="0.05" stroke-width="1"/>
    <path d="M 0,280 C 100,295 250,260 400,295 C 550,330 750,270 850,295" stroke-opacity="0.03" stroke-width="1"/>
  </g>

  <!-- Text elements -->
  <!-- Top Left Header -->
  <text x="44" y="58" fill="#a0aec0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">AI RESEARCHER • DEVELOPER • PROBLEM SOLVER</text>

  <!-- Name -->
  <text x="44" y="132" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">Subinoy Nath</text>

  <!-- Subtitles -->
  <text x="44" y="210" fill="#ff8f5e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">B.Tech Computer Science & Engineering</text>
  <text x="44" y="242" fill="#ff8f5e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">Barak Valley Engineering College (ASTU) · Sribhumi, Assam, India</text>
</svg>
