<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Card Background -->
  <rect width="64" height="64" rx="12" fill="#0d1117" stroke="#ff7a45" stroke-width="1.5"/>

  <!-- Tree Lines -->
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.5">
    <line x1="32" y1="16" x2="20" y2="34"/>
    <line x1="32" y1="16" x2="44" y2="34"/>
    <line x1="20" y1="34" x2="12" y2="50"/>
    <line x1="20" y1="34" x2="28" y2="50"/>
    <line x1="44" y1="34" x2="40" y2="50"/>
    <line x1="44" y1="34" x2="48" y2="50"/>
  </g>

  <!-- Tree Nodes (Circles) -->
  <g fill="#0b0f17" stroke="#ff7a45" stroke-width="1">
    <circle cx="32" cy="16" r="6"/>
    <circle cx="20" cy="34" r="5"/>
    <circle cx="44" cy="34" r="5"/>
    <circle cx="12" cy="50" r="4"/>
    <circle cx="28" cy="50" r="4"/>
    <circle cx="40" cy="50" r="4"/>
    <circle cx="48" cy="50" r="4"/>
  </g>

  <!-- Node Labels -->
  <g fill="#cbd5e1" font-family="Georgia, serif" font-size="8" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="16" font-size="9" font-weight="bold">+</text>
    <text x="20" y="34.5" font-size="9" font-weight="bold">*</text>
    <text x="44" y="34.5" font-size="6">sin</text>
    <text x="12" y="50" font-size="7" font-style="italic">x</text>
    <text x="28" y="50" font-size="7" font-style="italic">c</text>
    <text x="40" y="50" font-size="7" font-style="italic">x</text>
    <text x="48" y="50" font-size="7" font-style="italic">y</text>
  </g>
</svg>
